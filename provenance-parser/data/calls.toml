# 账本表：设计文档 §4.3 + §4.4 的唯一转录点。
#
# 为什么单独一张表：这些调用不进图，但它们的"为什么不进图"完全不同，
# 混在一个桶里会让报告把"采集端没解码"误读成"该动作无价值"。
# reason 字段就是给报告分组的：
#   no_object       —— 该动作天生没有客体（setuid / futex / poll）
#   not_decoded     —— 客体存在但采集端未解码参数（chown / ftruncate / wait4）
#   kernel_object   —— 内核对象没有可区分名字（R3）
#   fsync_covered   —— 数据流已由 write 边覆盖（§4.4）
#   low_value       —— 明确判为低价值（umount2）
#   scheduler       —— 调度噪声（switch）
#
# verdict：ops（无客体桶）/ drop（显式丢弃桶）/ handle（仅句柄桶）/ attr（属性更新桶）

[[group]]
name = "handle"
verdict = "handle"
reason = "fd_table_only"
calls = ["close", "dup", "dup2", "dup3", "fcntl", "fcntl64", "lseek", "pipe", "pipe2"]

[[group]]
name = "attr"
verdict = "attr"
reason = "container_meta"
calls = ["container"]

[[group]]
name = "drop_fsync"
verdict = "drop"
reason = "fsync_covered"
calls = ["fsync", "fdatasync", "msync"]

[[group]]
name = "drop_low_value"
verdict = "drop"
reason = "low_value"
calls = ["umount2"]

[[group]]
name = "drop_sched"
verdict = "drop"
reason = "scheduler"
calls = ["switch", "sched_switch"]

[[group]]
name = "priv"
verdict = "ops"
reason = "no_object"
calls = ["setuid", "setgid", "setresuid", "setresgid", "setreuid", "setregid", "setfsuid", "setfsgid", "setgroups", "capset", "prctl", "personality", "setrlimit", "prlimit", "prlimit64", "ioprio_set", "sched_setscheduler", "sched_setaffinity", "setpriority", "setsid", "setpgid", "umask", "arch_prctl", "chdir", "fchdir", "sethostname", "quotactl"]

[[group]]
name = "utimes"
verdict = "ops"
reason = "not_decoded"
calls = ["utimensat", "utimes", "futimesat"]

[[group]]
name = "chown"
verdict = "ops"
reason = "not_decoded"
calls = ["chown", "fchown", "lchown", "fchownat", "setxattr", "lsetxattr", "fsetxattr", "removexattr", "lremovexattr", "fremovexattr"]

[[group]]
