# 动词表：设计文档 §4.2 + §4.6 的唯一转录点。
#
# 字段：
#   name   —— 动词名（进边属性 action）
#   edge   —— 边类（p2p / p2f / f2p / p2n / n2p）
#   source —— 客体来源（fd / path / pid / tuple）
#   gate   —— always = 对象在调用前已存在，成功失败都建边（§4.1-4）
#              success = 对象由本次调用产生，只在退出行 res 达标时建边（§4.6）
#   calls  —— 归入该动词的系统调用名（evt.type 原样）
#
# 约定：module / bpf / io_uring / shm 四个内核对象动词本版延后，
# 归入 calls.toml 的 kernel 组（客体无稳定名字，R3），不进本表。

[[verb]]
name = "clone"
edge = "p2p"
source = "pid"
gate = "success"
calls = ["clone", "clone3", "fork", "vfork"]
note = "res>0 取子 pid；flags 含 CLONE_THREAD 属线程，不建边"

[[verb]]
name = "exec"
edge = "p2p"
source = "path"
gate = "success"
calls = ["execve", "execveat"]
note = "旧身份 -> 新身份；同一事件另出 f2p load_image"

[[verb]]
name = "exit"
edge = "p2p"
source = "pid"
gate = "always"
calls = ["exit", "exit_group", "procexit"]
note = "父进程 -> 退出进程；克隆边优先，回退 ppid"

[[verb]]
name = "signal"
edge = "p2p"
source = "pid"
gate = "always"
calls = ["kill", "tgkill", "tkill", "pidfd_send_signal"]
note = "目标按 §5.7 解析；自信号与 pid<=0 不建边"

[[verb]]
name = "ptrace"
edge = "p2p"
source = "pid"
gate = "always"
calls = ["ptrace"]

[[verb]]
name = "wait"
edge = "p2p"
source = "pid"
gate = "always"
calls = ["wait4", "waitid", "waitpid"]

[[verb]]
name = "mem_read"
edge = "p2p"
source = "pid"
gate = "always"
calls = ["process_vm_readv"]

[[verb]]
name = "mem_write"
edge = "p2p"
source = "pid"
gate = "always"
calls = ["process_vm_writev"]

[[verb]]
name = "pidfd_getfd"
edge = "p2p"
source = "pid"
gate = "always"
calls = ["pidfd_getfd"]

# open/openat/creat/openat2 由 classify 的 openat 分流规则处理（O_CREAT/O_TRUNC），
# 这里只登记不需要看 flags 的创建类调用。
[[verb]]
name = "create"
edge = "p2f"
source = "path"
gate = "success"
calls = ["mkdir", "mkdirat", "mknod", "mknodat", "memfd_create"]

[[verb]]
name = "link"
edge = "p2f"
source = "path"
gate = "success"
calls = ["link", "linkat", "symlink", "symlinkat"]
note = "客体=新路径；target_path=源文件路径或符号链接目标"

[[verb]]
name = "rename"
edge = "p2f"
source = "path"
gate = "success"
calls = ["rename", "renameat", "renameat2"]
note = "客体=新路径；old_path=源路径"

[[verb]]
name = "unlink"
edge = "p2f"
source = "path"
gate = "always"
calls = ["unlink", "unlinkat", "rmdir"]

[[verb]]
name = "truncate"
edge = "p2f"
source = "path"
gate = "always"
calls = ["truncate"]

[[verb]]
name = "write"
edge = "p2f"
source = "fd"
gate = "always"
calls = ["write", "writev", "pwrite", "pwrite64", "pwritev", "pwritev2", "sendfile", "sendfile64", "splice", "tee", "vmsplice", "copy_file_range"]
note = "套接字上的写由 emit 改投 send；sendfile/splice 两个 fd 各出一条"

[[verb]]
name = "chmod"
edge = "p2f"
source = "path"
gate = "always"
calls = ["chmod", "fchmod", "fchmodat", "fchmodat2"]
note = "mode 落边属性（八进制串）"

[[verb]]
name = "mount"
edge = "p2f"
source = "path"
gate = "always"
calls = ["mount"]
note = "客体=挂载点；fstype 进 ops 台账"

[[verb]]
name = "chroot"
edge = "p2f"
source = "path"
gate = "always"
calls = ["chroot", "pivot_root"]

[[verb]]
name = "ns"
edge = "p2f"
source = "fd"
gate = "always"
calls = ["setns"]

[[verb]]
name = "ioctl"
edge = "p2f"
source = "fd"
gate = "always"
calls = ["ioctl"]
note = "请求码不落图，进 ops 台账"

[[verb]]
name = "read"
edge = "f2p"
source = "fd"
gate = "always"
calls = ["read", "readv", "pread", "pread64", "preadv", "preadv2"]

[[verb]]
name = "load_image"
edge = "f2p"
source = "path"
gate = "success"
calls = []
note = "不独立分派；由 exec 的 emitter 在同一事件内产出"

[[verb]]
name = "mmap"
edge = "f2p"
source = "fd"
gate = "always"
calls = ["mmap", "mmap2"]
note = "匿名映射无客体：PROT_EXEC 记 exec_mem，否则记 anon_mmap"

[[verb]]
name = "probe"
edge = "f2p"
source = "path"
gate = "always"
calls = ["access", "faccessat", "faccessat2", "getdents", "getdents64", "statfs", "fstatfs", "readlink", "readlinkat", "newfstatat", "stat", "lstat", "fstat", "statx"]
note = "有客体才建边；本批多数调用参数为空，落无客体桶"

[[verb]]
name = "connect"
edge = "p2n"
source = "tuple"
gate = "always"
calls = ["connect"]
note = "元组良构即建边（不看 res）；失败由 res<0 表达"

[[verb]]
name = "bind"
edge = "p2n"
source = "tuple"
gate = "success"
calls = ["bind"]

[[verb]]
name = "listen"
edge = "p2n"
source = "tuple"
gate = "success"
calls = ["listen"]

[[verb]]
name = "send"
edge = "p2n"
source = "fd"
gate = "always"
calls = ["sendto", "sendmsg", "sendmmsg", "send"]
note = "res=字节；unix 套接字按客体类型改投 p2f"

[[verb]]
name = "accept"
edge = "n2p"
source = "tuple"
gate = "success"
calls = ["accept", "accept4"]

[[verb]]
name = "recv"
edge = "n2p"
source = "fd"
gate = "always"
calls = ["recvfrom", "recvmsg", "recvmmsg", "recv"]
