# 导航器全部参数 —— 唯一真源（provenance-navigator/config/navigator.toml）。
#
# 怎么用：改这里的数字，重跑即生效（程序启动时读一次）。
# 不在本文件里的东西：数据库连接与接口凭据（数据库口令、接口密钥、模型名）仍然在仓库根目录的 .env。
#
# 容错口径：某项没写 = 用程序内置的默认值；某项类型不对或小于下限 = 用默认值，并在启动时打印一行说明。
# 展开侧（第 1 层）**没有任何条数上限**，所以本文件里没有展开相关的项：
# 上游候选、子进程、管道组成员、待考察清单、单进程边数、查询返回行数全部不设限。
# 理由：任何条数上限都是按数据分布随机丢边——上限只要小于真实链长就会掉召回，而真实链长事先不知道。

[judge]
# 并发请求数上限。网关实测 20 个并发就限流，取 12 留余量。
concurrency = 12
# 模型是否先内部推理（官方接口上的那个字段）。开着实测：输出词数 7,453 → 26,446、
# 判定耗时 74.6 秒 → 231.1 秒，而多出来的字是网关返回的推理文字、代码读不到，所以关掉。
thinking = false
# 一批最多尝试几次（首次 + 失败后重发），**不是**「重试几次」。
batch_attempts = 2

[bundle]
# 判定单位是「束」：同一程序、同一动作、同一类对象上的一批边打成一个束，一束只给一个结论。
# 每批最多几个束。批越大调用越少、每束分摊到的上下文越少；批越小并发度越高。
batch = 40
# 每个束最多列几条成员样本（只影响看得见几条，不影响束的划分）。
samples = 2
# 判定调用上限；超出上限没判的束一律按「未排除」保留（失败即展开，不删边）。
cap_calls = 60
# 第 1 级按风险分数排序（网络边、离锚点近、含写边优先）。只改顺序，不改判定语义与闸门。
# 同预算实测（各 5 批调用，场景 5）：已确认 7/139 步 → 125/139 步，未排除覆盖两臂相同。
risk_schedule = true
# 聚合共享表：批头列「同类规模」与「上一级束」两张表，束行用编号引用（只改渲染）。
# 依据：把上百条连接、上百兆外发这类聚合事实拆散后，模型会按「例行会话」整批判无关。
aggregate = true
# 跨束痕迹：把已判相关的束留下的对象类别 / 程序痕迹标给后续批（纯结构量）。
annotate_marks = true
# 扇出闸门：拆分产生的单条边子束不判、直接归「未排除」。
fanout_guard = true
# 扇出闸门跳过的最大成员数（默认 1：只跳拆分产生的单条边子束）。
fanout_min = 1
# 空拆闸门：子束与上一级成员完全相同（没有新信息）时不重判、直接归「未排除」。
# 这是最大的方差修复：同一内容被判两次会出现结论翻转（一次翻转丢 399 条相关边）。
vacuous_guard = true
# 类一致性闸门：同一对象类别里已有束判「整束相关」时，同类里判「整束无关」的降级为「要拆」。
# 取值只允许 off / hot。
none_guard = "hot"
# 凭证闸门：判「整束无关」的束命中已知误杀模式时降级为「要拆」。**必须与空拆闸门同开**：
# 单独开会让更多「无关」降级为拆分、空拆翻倍，实测场景 2 崩到 31/52。
warrant_guard = true
# 启用的凭证（命中即降级）：deriv（束内全是派生边，在误杀束里命中 63.6% / 在正确排除的束里 2.5%）、
# proc（束的进程已出现在已确认相关的束里，18.2% / 2.7%）。
warrant_rule = "deriv,proc"

[render]
# 判定理由长度。提示词按这个数字要求模型写理由，代码按同一个数字截断渲染出来的理由，只写这一处。
reason_max_chars = 40

[logging]
# 所有只进日志、审计文件、原始输出样本的文字，统一按这个长度截断。
# 报告里每条已确认边的「理由」也是这个长度。
text_limit = 120
# 报告与统计里举几条样例（未判定的边举例、最慢的调用列表共用这一个数）。
sample_n = 5
# 诊断保留量：每次调用保留多少字符的原文样本，同时也是内存里最多留多少条调用明细。
diagnostic_keep = 2000

[llm]
# 单次请求的客户端超时（秒）。网关自己约 60 秒就返超时，客户端不需要等更久。
timeout_seconds = 120
# 接口库自身的重试次数。设 0 关掉它，重试交给程序自己的退避逻辑，免得两层叠加。
sdk_retries = 0
# 普通传输错误最多重试几次。
plain_retries = 3
# 普通重试的首次等待（秒），之后翻倍：2 秒、4 秒、8 秒。
plain_retry_base_seconds = 2.0
# 遇到限流最多等几次（每次 5~60 秒，总计约 3 分钟）。
rate_limit_waits = 8
# 限流第一次等多久（秒），之后依次递增。
rate_limit_wait_start_seconds = 5.0
# 限流单次等待的上限（秒）；网关给了建议秒数时优先听它的。
rate_limit_wait_max_seconds = 60.0
# 模型输出不是合法结构时，把错误灌回去再要一次的次数。
format_retries = 2

[prune]
# 后置剪枝：包管理器内部伴生碎片。名单与临时路径外置，代码不再写死。
managers = "dpkg,dpkg-deb,dpkg-split,dpkg-preconfigure,mandb,ldconfig,ldconfig.real"
internal_sinks = ".dpkg-new,.dpkg-tmp,.triggers,/usr/share/doc/,/usr/share/man/,/usr/share/locale/,/var/cache/man/,/var/cache/apt/,/var/lib/apt/lists/"
# 包管理器安装脚本关键字：命中即保护，不当作碎片剪掉。
postinst_tokens = "postinst"
